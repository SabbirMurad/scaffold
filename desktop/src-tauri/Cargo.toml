[package]
name = "scaffold_desktop"
version = "0.1.0"
edition = "2024"
description = "Scaffold desktop app"

# Standalone workspace so the desktop app builds independently of the web server.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
